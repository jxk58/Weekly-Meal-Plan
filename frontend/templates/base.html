<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meal Planner{% endblock %} · Meal Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('dashboard') }}">Meal Planner</a>
    <nav class="site-nav" aria-label="Main">
      {% set links = [
        ('dashboard', 'dashboard', 'Home'),
        ('meals', 'meal_plan', 'Meals'),
        ('inventory', 'inventory', 'Inventory'),
        ('grocery', 'grocery_list', 'Grocery'),
      ] %}
      {% for key, route, label in links %}
        <a href="{{ url_for(route) }}"{% if active == key %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
