[project]
name = "weekly-meal-plan"
version = "0.1.0"
description = "Personal household weekly meal planner, food inventory, and grocery list."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Application, not a library: install dependencies only, don't build/install the project itself.
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations dir) would otherwise make ruff treat the alembic package as first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]
