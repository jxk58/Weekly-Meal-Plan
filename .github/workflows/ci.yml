name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Future DB tests: add a Postgres service container here, e.g.
    #   services:
    #     postgres:
    #       image: postgres:<pinned version>
    #       env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: meal_planner_test }
    #       ports: ["5432:5432"]
    #       options: >-
    #         --health-cmd pg_isready --health-interval 5s
    #         --health-timeout 5s --health-retries 10
    # and pass the test database URL to the "Run tests" step via `env:`.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv reads the Python version from .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy backend/app index.py

      - name: Run tests (pytest)
        run: uv run pytest
