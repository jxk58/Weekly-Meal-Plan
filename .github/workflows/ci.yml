name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Future DB tests: add a Postgres service container here, e.g.
    #   services:
    #     postgres:
    #       image: postgres:<pinned version>
    #       env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: meal_planner_test }
    #       ports: ["5432:5432"]
    #       options: >-
    #         --health-cmd pg_isready --health-interval 5s
    #         --health-timeout 5s --health-retries 10
    # then run `npm run db:migrate` and pass DATABASE_URL to the test step via `env:`.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm test

      # The build catches Cache Components and prerendering errors that the checks above can't.
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
